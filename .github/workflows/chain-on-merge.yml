name: chain-on-merge

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  next:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'agent/spec-') &&
      vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh workflow run agent-implement-spec.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
