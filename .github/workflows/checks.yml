name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: UV_PROJECT_ENVIRONMENT=.venv uv sync --frozen
      - run: make check
      - name: Oracle reference walkthrough
        run: python3 scripts/run_check.py python scripts/oracle_walkthrough.py --out "${{ runner.temp }}/oracle-reference-evidence"
      - name: Retain oracle reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-reference-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oracle-reference-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Generator diagnostics walkthrough
        run: python3 scripts/run_check.py python scripts/prior_walkthrough.py --out "${{ runner.temp }}/prior-diagnostic-evidence"
      - name: Retain generator diagnostics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prior-diagnostic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prior-diagnostic-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Sampling profile walkthrough
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python3 scripts/run_check.py python scripts/sampling_walkthrough.py --out "${{ runner.temp }}/sampling-profile-evidence"
      - name: Retain sampling profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-profile-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sampling-profile-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Job summary
        if: always()
        run: echo "### checks · $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Sampled saved-run walkthrough
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python3 scripts/run_check.py python scripts/sampled_run_walkthrough.py --out "${{ runner.temp }}/sampled-run-evidence"
      - name: Retain sampled run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampled-run-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sampled-run-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Qualification reporting and limit checks
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python3 scripts/run_check.py python scripts/qualification_failure_walkthrough.py --out "${{ runner.temp }}/qualification-reporting"
          python3 scripts/run_check.py python scripts/qualify_generators.py --families polynomial gp composition --sizes small --task-types regression --repetitions 1 --out "${{ runner.temp }}/qualification-preflight"
      - name: Retain qualification preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualification-reporting/
            ${{ runner.temp }}/qualification-preflight/
          if-no-files-found: ignore
          retention-days: 14
