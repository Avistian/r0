name: Agent — Implement A Ticket

# Caller: implementation and guard tests live in Avistian/ml-factory.
on:
  issues:
    types: [labeled]

# The permissions block. It is per-workflow, and it is a ceiling on the
# GITHUB_TOKEN — and the GITHUB_TOKEN now only checks the code out. Everything
# that writes goes through FACTORY_PAT, whose reach is set where you created
# it, not here.

concurrency:
  group: agent-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  factory:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    uses: Avistian/ml-factory/.github/workflows/agent-implement.yml@94ccc691b6c09228767f59b86e96e06290ccb6ff
    secrets:
      FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
