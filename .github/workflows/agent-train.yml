name: agent-train

# Caller: implementation and guard tests live in Avistian/ml-factory.
on:
  workflow_dispatch:
    inputs:
      config: { required: true, type: string }
      run:    { required: true, type: string }
  issues:
    types: [labeled]

concurrency:
  group: agent-train
  cancel-in-progress: false            # never cancel a live training job

jobs:
  factory:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: Avistian/ml-factory/.github/workflows/agent-train.yml@462fbd57fca0e3a1b9e18c4eeb453bebe0f1bc2e
    with:
      config: ${{ inputs.config }}
      run: ${{ inputs.run }}
    secrets:
      FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
