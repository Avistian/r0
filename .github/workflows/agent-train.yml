name: agent-train

# Caller: implementation and guard tests live in Avistian/ml-factory.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: train
        options: [train, generation]
      workers: { type: number, default: 2 }
      retry_failed: { type: boolean, default: false }
      config: { required: true, type: string }
      run:    { required: true, type: string }
  issues:
    types: [labeled]

concurrency:
  group: agent-train
  cancel-in-progress: false            # never cancel a live training job

jobs:
  factory:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: Avistian/ml-factory/.github/workflows/agent-train.yml@94ccc691b6c09228767f59b86e96e06290ccb6ff
    with:
      mode: ${{ inputs.mode || 'train' }}
      workers: ${{ inputs.workers || 2 }}
      retry_failed: ${{ inputs.retry_failed || false }}
      config: ${{ inputs.config }}
      run: ${{ inputs.run }}
    secrets:
      FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
