[project]
license = "Apache-2.0"
name = "r0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Avistian", email = "pszar92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "relbench>=3.1,<4",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mutmut>=3.8.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.scripts]
r0 = "r0.cli:main"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PT", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-q --disable-socket --allow-unix-socket"   # no network in tests, ever
markers = ["smoke: tiny CPU training run, under a minute"]

[tool.importlinter]
root_package = "r0"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
  "r0.cli",
  "r0.modules.leaderboard",
  "r0.modules.training | r0.modules.evaluation",
  "r0.modules.batching | r0.modules.relbench_adapter | r0.modules.model",
  "r0.modules.featurize | r0.modules.priors",
  "r0.modules.reldb",
]

[[tool.importlinter.contracts]]
name = "ADR 0002: the training path never sees real data"
type = "forbidden"
source_modules = ["r0.modules.priors", "r0.modules.featurize", "r0.modules.batching",
                  "r0.modules.training", "r0.modules.model"]
forbidden_modules = ["relbench", "r0.modules.relbench_adapter", "r0.modules.evaluation", "lightgbm"]

[[tool.importlinter.contracts]]
name = "Only the adapter imports relbench"
type = "forbidden"
source_modules = ["r0.cli", "r0.modules.evaluation", "r0.modules.leaderboard", "r0.modules.reldb"]
forbidden_modules = ["relbench"]
