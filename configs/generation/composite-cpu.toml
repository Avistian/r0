[recipe]
version = "composite-v1"
calibration_rows = 512
expression = {operation = "product", children = [0, 1]}

[recipe.task]
rows = 128
context_rows = 96
noise_ratio = 0.5

[[recipe.components]]
strength = 1.0
[recipe.components.recipe]
version = "polynomial-v1"
degree = 2
calibration_rows = 512

[[recipe.components]]
strength = 0.5
[recipe.components.recipe]
version = "smooth-v1"
family = "sinusoidal"
projection = "ridge"
terms = 16
calibration_rows = 512

[run]
seed = 27
count = 8
group_size = 4
max_seconds = 60
max_bytes = 10485760
device = "cpu"
