[recipe]
version = "grouped-linear-v1"
group_size = 4

[recipe.inputs]
distribution = "mixture"
mixture_gap = 2.0

[recipe.task]
rows = 128
context_rows = 96
features = 16
signal_features = 16
active_features = 8
noise_ratio = 0.5

[run]
seed = 27
count = 8
group_size = 4
max_seconds = 60
max_bytes = 10485760
device = "cpu"
