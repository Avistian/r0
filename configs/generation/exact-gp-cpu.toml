[recipe]
version = "exact-gp-v1"
combine = "sum"
calibration_rows = 64

[recipe.task]
rows = 128
context_rows = 96
features = 8
signal_features = 8
active_features = 4
noise_ratio = 0.5

[recipe.inputs]
distribution = "student_t"
df = 1.0

[[recipe.kernels]]
kind = "rbf"
axes = [0, 1]
feature_scales = [1.0, 2.0]
weight = 3.0

[[recipe.kernels]]
kind = "matern52"
axes = [2, 3]
feature_scales = [2.0, 1.0]
weight = 7.0

[run]
seed = 27
count = 8
group_size = 4
max_seconds = 60
max_bytes = 10485760
device = "cpu"
